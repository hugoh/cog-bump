---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@3e091539f646b59881c1eb0dfbbf93ac7c23d79e # v1.40.15
    permissions:
      contents: write
    with:
      major-tag: true
