---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@2db23a2966319ce5f285d69efea3fce04aadf8ef # v1.40.16
    permissions:
      contents: write
    with:
      major-tag: true
