name: cog-bump
description: >-
  Bump the version with cocogitto (bundled fleet cog.toml or a repo-supplied one),
  push the tag(s), and output them (empty if nothing to release).
branding:
  icon: tag
  color: blue
inputs:
  bump:
    description: "one of: auto, patch, minor, major"
    required: false
    default: auto
  config:
    description: >-
      Path to a cog.toml to use instead of the bundled fleet config. Set this for
      monorepos that need a [packages] table.
    required: false
    default: ""
  push:
    description: "Push the created tag(s) to origin (needs contents: write)"
    required: false
    default: "true"
  token:
    description: Token used for the tag push
    required: false
    default: ${{ github.token }}
outputs:
  tag:
    description: First tag cocogitto created, or empty when nothing was releasable
    value: ${{ steps.bump.outputs.tag }}
  tags:
    description: >-
      All tags cocogitto created (newline-separated), empty when none. A monorepo
      `cog bump --auto` can create several at once.
    value: ${{ steps.bump.outputs.tags }}
runs:
  using: composite
  steps:
    - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
      with:
        command: "--version"
    - id: bump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BUMP: ${{ inputs.bump }}
        CONFIG: ${{ inputs.config }}
        PUSH: ${{ inputs.push }}
      run: python3 "$GITHUB_ACTION_PATH/cog_bump.py"
