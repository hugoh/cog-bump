[project]
name = "cog-bump"
version = "0.1.0"
description = "Composite action helper: cocogitto tag-only bump with multi-tag output"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
